# Agent OS Standards Index

api:
  route-registration-order:
    description: Flask literal routes must register before wildcard routes of the same shape

database:
  alias-resolution:
    description: Builder lookups use LOWER() case-insensitive join on builder_aliases; fall back to court_listings external_id if name lookup misses
  matched-alias:
    description: Every court_listing stores the alias that discovered it — set at upsert, never updated
  upsert-immutability:
    description: court_listings upsert rules — which fields are immutable vs refreshed on conflict

scraper:
  alias-matching:
    description: alias_match_side() returns 'respondent'|'applicant'|None — checks both sides of "v", word-boundary, company indicator for single-word aliases
  run-entry-point:
    description: run() in scraper.main is the sole entry point for all scrape operations — CLI, Flask, and cron
  scrape-intervals:
    description: Only two intervals used — 1 for seeded daily builders, 20 for auto-created builders

testing:
  test-structure:
    description: Unit vs integration vs live split, clean_db fixture pattern, NSW API mock approach
